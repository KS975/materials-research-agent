[project]
name = "materials-research-agent"
version = "0.1.2b5"
description = "Materials Research Agent - MySQL + RAG + modeling + optimization + autonomous loop"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "httpx==0.28.1",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.20",
  "PyMySQL[rsa]==1.2.0",
  "langgraph==1.2.10",
  "qdrant-client==1.14.3",
  "python-docx==1.1.2",
  "pypdf==5.9.0",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "scikit-learn==1.5.2",
  "joblib==1.4.2",
  "threadpoolctl==3.5.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: tests that require a real MySQL connection",
]
