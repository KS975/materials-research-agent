[project]
name = "materials-research-agent"
version = "0.1.2b5"
description = "Materials Research Agent V0.1.2-B05 - MySQL + file parsing + Qdrant Knowledge Index"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "httpx==0.28.1",
  "PyMySQL[rsa]==1.2.0",
  "langgraph==1.2.10",
  "qdrant-client>=1.14,<2",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: tests that require a real MySQL connection",
]
